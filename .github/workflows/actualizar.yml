name: Actualizar radar

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descargar resultados y cuotas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/actualizar.py
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos
          git commit -m "Datos $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

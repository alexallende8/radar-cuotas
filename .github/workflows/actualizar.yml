name: Actualizar radar

on:
  schedule:
    - cron: "30 7 * * *"      # mañana: resultados + cuotas + apuestas + correo
    - cron: "15 22 * * *"     # noche: solo resultados del día (no gasta créditos ni envía correo)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descargar resultados y cuotas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SOLO_RESULTADOS: ${{ github.event.schedule == '15 22 * * *' && '1' || '' }}
        run: python radar-cuotas/scripts/actualizar.py
      - name: Simulador
        run: node radar-cuotas/scripts/simular.js
      - name: Guardar datos en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radar-cuotas/datos
          git commit -m "Datos $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push
      - name: Aviso por correo
        if: github.event.schedule != '15 22 * * *'
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AVISO_EMAIL: ${{ secrets.AVISO_EMAIL }}
        run: python radar-cuotas/scripts/avisar.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: radar-cuotas

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

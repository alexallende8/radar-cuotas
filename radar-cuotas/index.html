<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de cuotas</title>
<style>
:root{
  --bg:#f3f6f4; --surface:#fff; --surface-2:#e8eee9; --ink:#14201b; --ink-2:#4f5e57; --line:#d6dfda;
  --brand:#1f6f5c; --brand-ink:#fff; --gain:#1f7a4d; --loss:#b42318; --warn:#8f5a0a; --warn-bg:#fbf0d9; --pend:#3d5a80;
  --bar:#cfdcd5; --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --surface:#16211d; --surface-2:#1e2b26; --ink:#e6eeea; --ink-2:#9fb2a9; --line:#2b3a34;
    --brand:#5cc3a4; --brand-ink:#0f1714; --gain:#5cc38c; --loss:#f08a7e; --warn:#e7b65a; --warn-bg:#2d2616; --pend:#93b4dc;
    --bar:#2c3d36; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --surface-2:#1e2b26; --ink:#e6eeea; --ink-2:#9fb2a9; --line:#2b3a34;
  --brand:#5cc3a4; --brand-ink:#0f1714; --gain:#5cc38c; --loss:#f08a7e; --warn:#e7b65a; --warn-bg:#2d2616; --pend:#93b4dc;
  --bar:#2c3d36; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:70px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
.sub{color:var(--ink-2);font-size:13px}
main{max-width:720px;margin:0 auto;padding:12px 14px 24px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:11px 1px 10px;font:inherit;font-size:12px;color:var(--ink-2);border-radius:0}
nav button.on{color:var(--brand);font-weight:650;box-shadow:inset 0 3px 0 var(--brand)}
h2{font-size:15.5px;margin:20px 0 6px}
.lead{color:var(--ink-2);font-size:13px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.tap{cursor:pointer}
.banner{border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px;background:var(--warn-bg);color:var(--warn);border:1px solid currentColor}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.teams{font-weight:620}
.muted{color:var(--ink-2);font-size:13px}
.pos{color:var(--gain)} .neg{color:var(--loss)} .pen{color:var(--pend)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);margin:4px 4px 0 0}
.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.ok{background:var(--brand);color:var(--brand-ink)}
.big{font-size:26px;font-weight:750;letter-spacing:-.02em;margin:2px 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin-top:6px}
.kpi b{display:block;font-size:18px} .kpi span{font-size:12px;color:var(--ink-2)}
.bar3{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 3px;background:var(--bar)}
.bar3 i{display:block;height:100%} .bar3 i:nth-child(1){background:var(--brand)} .bar3 i:nth-child(2){background:var(--ink-2);opacity:.45} .bar3 i:nth-child(3){background:var(--pend)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.mk{border-top:1px solid var(--line);padding:9px 0}
.mk:first-child{border-top:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12.5px;margin-top:4px}
.grid4 span{display:block;color:var(--ink-2);font-size:11px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
button,select,input{font:inherit;font-size:14px}
button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
input[type=number],input[type=text],select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
input.odds{width:76px}
.form span{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;margin-right:2px;color:#fff}
.W{background:#1f7a4d}.D{background:#7a8580}.L{background:#b42318}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink-2);font-weight:550;font-size:12px}
.empty{padding:14px;text-align:center;color:var(--ink-2)}
details summary{cursor:pointer;color:var(--brand);font-size:13px;margin-top:4px}
details p,details li{font-size:13px;color:var(--ink-2)}
ol{padding-left:20px}
.setting{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:8px 0}
.setting small{display:block;color:var(--ink-2);font-size:12px}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

function contextTags(f, tb) {
  const tags = [], rh = tb.byTeam[f.home], ra = tb.byTeam[f.away];
  const ppg = (o) => o.pj ? o.pts / o.pj : null;
  if (rh && rh.c.pj >= 3) { if (ppg(rh.c) >= 2) tags.push("local fuerte en casa"); if (ppg(rh.c) <= 0.8) tags.push("local flojo en casa"); }
  if (ra && ra.f.pj >= 3) { if (ppg(ra.f) >= 2) tags.push("visitante fuerte fuera"); if (ppg(ra.f) <= 0.8) tags.push("visitante flojo fuera"); }
  if (rh && ra && tb.minPj >= 5) {
    if (rh.pos <= 4 && ra.pos > tb.n - 4) tags.push("puntero contra zona baja");
    if (ra.pos <= 4 && rh.pos > tb.n - 4) tags.push("zona baja contra puntero");
  }
  return tags;
}

function analyse(f) {
  const lm = leagueModel(f.div, f.date);
  const out = {f, ok: false};
  if (!lm) { out.why = "Sin histórico suficiente de esta liga: sube su CSV de la temporada."; return out; }
  const th = lm.T[f.home], ta = lm.T[f.away];
  if (!th || !ta) { out.why = `Equipo sin partidos en el histórico (${!th ? f.home : f.away}). Revisa el nombre o sube la temporada anterior.`; return out; }
  let lam = lm.L.avgH * th.attC * ta.defF, mu = lm.L.avgA * ta.attF * th.defC;
  // clasificación: puntos por partido del local en casa frente a los del visitante fuera (encogidos hacia la media)
  const tb = lm.table, rh = tb.byTeam[f.home], ra = tb.byTeam[f.away];
  let tableAdj = null;
  if (S.settings.tableW > 0 && rh && ra && tb.avgC && tb.avgF) {
    const kk = 5, sH = (rh.c.pts + kk * tb.avgC) / (rh.c.pj + kk) / tb.avgC, sA = (ra.f.pts + kk * tb.avgF) / (ra.f.pj + kk) / tb.avgF;
    const m = Math.pow(sH / sA, S.settings.tableW / 2);
    lam *= m; mu /= m; tableAdj = {sH, sA, m};
  }
  const Mm = poisMatrix(lam, mu), Pm = probs(Mm);
  const ref = f.odds.PS && f.odds.PS.H ? f.odds.PS : f.odds.Avg && f.odds.Avg.H ? f.odds.Avg : f.odds.B365;
  let Pk = null, Ma = Mm;
  const p1 = ref ? devig([ref.H, ref.D, ref.A]) : null;
  if (p1) {
    // más/menos 2,5 de la referencia; si Pinnacle no lo publica, la media del mercado sin margen
    const ou = ref.O25 && ref.U25 ? ref : [f.odds.Avg, f.odds.B365, f.odds.Max].find((x) => x && x.O25 && x.U25);
    const po = ou ? devig([ou.O25, ou.U25]) : null;
    const [l2, m2] = fitMarket(p1, po ? po[0] : null);
    const Mk = poisMatrix(l2, m2); Pk = probs(Mk);
    const w = S.settings.w; Ma = Mm.map((v, i) => w * v + (1 - w) * Mk[i]);
  }
  const Pa = probs(Ma);
  const nmin = Math.min(th.n, ta.n);
  const conf = nmin >= 8 && p1 ? "Alta" : nmin >= 12 ? "Media" : "Baja";
  const book = f.odds[S.settings.book] || f.odds.B365 || f.odds.Avg || {};
  const sels = MARKETS.map(([c, label, grp]) => {
    const typed = S.typed[f.id + "|" + c];
    const o = typed || book[c.replace("O25", "O25")] || null;
    const p = Pa[c], pmod = Pm[c], pmk = Pk ? Pk[c] : null;
    const thrE = S.settings.thr + 0.02 * Math.max(0, (o || 0) - 2.5);
    const ev = o ? p * o - 1 : null;
    let minO = (1 + S.settings.thr) / p; if (minO > 2.5) minO = (1 + S.settings.thr - 0.05) / (p - 0.02);
    const gap = pmk != null ? Math.abs(pmod - pmk) : null;
    let verdict = "", why = "";
    if (!o) { verdict = "sin cuota"; why = `Interesa a partir de ${num(minO)}`; }
    else if (gap != null && gap > 0.08) { verdict = "dudosa"; why = "El modelo discrepa mucho del mercado: posible información que el modelo no ve (bajas, rotaciones)."; }
    else if (conf === "Baja") { verdict = "dudosa"; why = "Pocos partidos en el histórico de algún equipo."; }
    else if (o < 1.4 || o > 6) { verdict = "fuera de rango"; why = "Cuota demasiado baja o demasiado alta para este modelo."; }
    else if (ev >= thrE) { verdict = "valor"; why = `EV ${spct(ev)} por euro, por encima del ${pct(thrE, 1)} exigido.`; }
    else { verdict = "sin valor"; why = ev >= 0 ? "Ventaja demasiado pequeña para el margen de error." : "La cuota paga menos de lo que vale el resultado."; }
    let stake = 0;
    if (verdict === "valor") {
      const f = S.settings.kelly * (p * o - 1) / (o - 1);
      stake = Math.floor(Math.min(f, S.settings.maxPct) * S.settings.bank * 2) / 2;
      if (stake < 1) { stake = 0; why += " Ventaja tan pequeña que el stake sugerido no llega a 1 €."; }
    }
    return {c, label, grp, p, pmod, pmk, o, typed: !!typed, ev, minO, fair: 1 / p, verdict, why, stake};
  });
  Object.assign(out, {ok: true, lm, th, ta, lam, mu, Pm, Pk, Pa, conf, sels, signals: signals(f, lm), tags: contextTags(f, tb), rh, ra, tableAdj});
  out.trends = trendTags(out);
  return out;
}

function recent(team, n = 6) { return team.games.slice(-n); }
function signals(f, lm) {
  const out = [];
  if (!lm.L.hasShots) return out;
  for (const [name, side] of [[f.home, "home"], [f.away, "away"]]) {
    const T = lm.T[name]; if (!T) continue;
    const g = recent(T).filter((x) => x.sf != null);
    if (g.length < 5) continue;
    const gf = g.reduce((s, x) => s + x.gf, 0), sot = g.reduce((s, x) => s + x.sf, 0), xg = sot * lm.L.conv;
    const ga = g.reduce((s, x) => s + x.ga, 0), sota = g.reduce((s, x) => s + x.sa, 0), xga = sota * lm.L.conv;
    if (gf - xg <= -2.5) out.push({team: name, type: "ataque_frio", txt: `${name} tira y no marca: ${gf} goles en ${g.length} partidos con ${sot} tiros a puerta; por tiros cabrían unos ${num(xg, 1)}.`, d: gf - xg});
    if (gf - xg >= 2.5) out.push({team: name, type: "ataque_caliente", txt: `${name} marca más de lo que genera: ${gf} goles con ${sot} tiros a puerta (esperables ${num(xg, 1)}). Puede bajar.`, d: gf - xg});
    if (ga - xga <= -2.5) out.push({team: name, type: "defensa_suerte", txt: `${name} concede menos de lo que permite: ${ga} ${ga === 1 ? "gol recibido" : "goles recibidos"} con ${sota} tiros a puerta en contra (esperables ${num(xga, 1)}).`, d: ga - xga});
    if (ga - xga >= 2.5) out.push({team: name, type: "defensa_mala_suerte", txt: `${name} recibe más de lo que permite: ${ga} goles con ${sota} tiros a puerta en contra (esperables ${num(xga, 1)}).`, d: ga - xga});
  }
  return out;
}

function wonSel(c, hg, ag) {
  const tot = hg + ag;
  return {H: hg > ag, D: hg === ag, A: hg < ag, "1X": hg >= ag, X2: hg <= ag, "12": hg !== ag, O05: tot > 0, O15: tot > 1, U15: tot < 2, O25: tot > 2, U25: tot < 3,

}
function findResult(div, home, away, date) {
  return (S.hist[div] || []).find((x) => x[1] === home && x[2] === away && Math.abs(new Date(x[0]) - new Date(date)) <= 2 * 864e5);

/* ------------------------------------------------ apuesta del día: la más probable con cuota >= 2 */
function dailyPick(day) {
  const ms = A.filter((a) => a.ok && a.f.date === day && a.conf !== "Baja");
  const singles = [], legs = [];
  for (const a of ms) {
    const opts = a.sels.filter((s) => s.o && !s.typed && ["H", "D", "A", "O25", "U25"].includes(s.c));
    for (const s of opts) if (s.o >= 2) singles.push({legs: [{a, s}], P: s.p, O: s.o});
    const best = opts.filter((s) => s.o >= 1.2).sort((x, y) => y.p - x.p)[0];
    if (best) legs.push({a, s: best});
  }
  legs.sort((x, y) => y.s.p - x.s.p); const L = legs.slice(0, 14), cands = [...singles];
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
    const two = [L[i], L[j]], O2 = L[i].s.o * L[j].s.o;
    if (O2 >= 2) cands.push({legs: two, P: L[i].s.p * L[j].s.p, O: O2});
    for (let k = j + 1; k < L.length; k++) {
      const O3 = O2 * L[k].s.o;
      if (O3 >= 2) cands.push({legs: [...two, L[k]], P: L[i].s.p * L[j].s.p * L[k].s.p, O: O3});
    }
  }
  if (!cands.length) return null;
  const b = cands.sort((x, y) => y.P - x.P)[0];
  return {...b, EV: b.P * b.O - 1, tipo: b.legs.length === 1 ? "simple" : `combinada de ${b.legs.length}`};
}
function nextPickDay() {
  const now = madridNow(), days = [...new Set(A.filter((a) => a.ok && a.sels.some((s) => s.o)).map((a) => a.f.date))].sort();
  return days.find((d) => d >= now.date) || null;
}
const DAILY_STAKE = 5;
function favPick(day) {
  // regla probada en el histórico: favoritos (local o visitante) a cuota 1,20-1,40, de menor a mayor, hasta llegar a 2
  const legs = [];
  for (const a of A.filter((x) => x.ok && x.f.date === day)) {
    const bk = a.f.odds.B365 && a.f.odds.B365.H ? a.f.odds.B365 : a.f.odds.Avg || {};
    for (const c of ["H", "A"]) if (bk[c] >= 1.2 && bk[c] <= 1.4) legs.push({a, s: a.sels.find((x) => x.c === c), o: bk[c]});
  }
  legs.sort((x, y) => x.o - y.o);
  const sel = []; let O = 1;
  for (const l of legs) { if (O >= 2) break; if (sel.some((x) => x.a.f.id === l.a.f.id)) continue; sel.push(l); O *= l.o; }
  if (O < 2) return null;
  const P = sel.reduce((p, l) => p * l.s.p, 1);
  return {legs: sel.map((l) => ({a: l.a, s: {...l.s, o: l.o}})), O, P, EV: P * O - 1, tipo: `combinada de ${sel.length}`};

/* CLV: compara la cuota tomada con la cuota de cierre (sin margen) que publica football-data tras el partido.
   Positivo = conseguiste mejor precio que el mercado justo antes de empezar. */
function closingFair(row, c) {
  if (!row || row.length < 14) return null;
  const set = ["H", "D", "A"].includes(c) ? [row[9], row[10], row[11]] : ["O25", "U25"].includes(c) ? [row[12], row[13]] : null;
  if (!set || set.some((x) => !x)) return null;
  const p = devig(set);
  return p ? p[["H", "D", "A"].includes(c) ? ["H", "D", "A"].indexOf(c) : ["O25", "U25"].indexOf(c)] : null;
}
function clvOf(leg, o) {
  const pc = closingFair(findResult(leg.div, leg.home, leg.away, leg.date), leg.c);
  return pc ? o * pc - 1 : null;

const meanOrNull = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

function simSystem(sim, key, picker) {

    let all = true, lost = false;
    for (const l of d.legs) {
      const r = findResult(l.div, l.home, l.away, l.date);
      if (!r) { all = false; continue; }
      l.result = `${r[3]}-${r[4]}`; l.won = !!wonSel(l.c, r[3], r[4]); if (!l.won) lost = true;
    }
    if (lost) { d.status = "perdida"; d.pnl = -d.stake; }

    neu.push(`Porterías a cero: ${f.home} ${hAll.filter((g) => g.ga === 0).length}/${hAll.length}, ${f.away} ${vAll.filter((g) => g.ga === 0).length}/${vAll.length}`);
  }
  if (["LO05", "LO15"].includes(c) && H.n >= 3) neu.push(`${f.home} marca en casa ${num(H.gf / H.n, 1)} goles por partido; ${f.away} recibe fuera ${V.n ? num(V.ga / V.n, 1) : "—"}`);
  if (["VO05", "VO15"].includes(c) && V.n >= 3) neu.push(`${f.away} marca fuera ${num(V.gf / V.n, 1)} goles por partido; ${f.home} recibe en casa ${H.n ? num(H.ga / H.n, 1) : "—"}`);
  for (const sg of a.signals) neu.push(sg.txt);
  for (const t of (a.trends ? a.trends.items : [])) neu.push(t.txt);
  const h2h = (S.hist[f.div] || []).filter((r) => ((r[1] === f.home && r[2] === f.away) || (r[1] === f.away && r[2] === f.home)) && r[0] < f.date).slice(-4);
  if (h2h.length) neu.push(`Últimos enfrentamientos (poco predictivos): ${h2h.map((r) => `${r[1]} ${r[3]}-${r[4]} ${r[2]}`).join(" · ")}`);
  return {fav, con, neu, lr};
}
function analyseBet(fid, c, o) {
  const a = A.find((x) => x.f.id === fid); if (!a || !a.ok) return null;
  const s = a.sels.find((x) => x.c === c); if (!s) return null;
  const odds = o || s.o, ev = odds ? s.p * odds - 1 : null, facts = factsFor(a, c);
  let verdict, cls_;
  if (!odds) { verdict = `Sin cuota: solo tendría sentido a partir de ${num(s.minO)}.`; cls_ = "pen"; }
  else if (a.conf === "Baja") { verdict = "Datos insuficientes de algún equipo: mejor no fiarse del cálculo."; cls_ = "warn"; }
  else if (ev >= 0.03 + 0.02 * Math.max(0, odds - 2.5)) { verdict = `Tiene valor: la cuota ${num(odds)} paga más de lo que vale (${pct(s.p)} → justa ${num(s.fair)}).`; cls_ = "pos"; }
  else if (ev >= -0.02) { verdict = `Cuota justa: ni gana ni pierde a la larga (justa ${num(s.fair)}).`; cls_ = "pen"; }
  else { verdict = `Sin valor: la cuota ${num(odds)} paga menos de lo que vale; haría falta ${num(s.minO)} o más.`; cls_ = "neg"; }
  return {a, s, odds, ev, facts, verdict, cls_};
}

  return `<div class="card"><div class="row"><span class="teams">${esc(a.f.home)} – ${esc(a.f.away)}</span><span class="muted">${fdate(a.f.date)} ${esc(a.f.time)}</span></div>

/* ------------------------------------------------ montador de combinadas */
const UI = {target: 2, day: "", maxLegs: 4, mk1x2: true, mkGoals: true, mkOther: false, noOdds: false, res: null,
            an: {fid: "", c: "H", o: ""}, anRes: null};
const MK_GROUP = {"1X2": "mk1x2", Doble: "mk1x2", Goles: "mkGoals", Ambos: "mkOther", Equipo: "mkOther"};
function buildCombos() {
  const day = UI.day, T = Math.max(1.05, +UI.target || 2), maxL = +UI.maxLegs || 4;
  const pool = [];
  for (const a of A.filter((x) => x.ok && (day ? x.f.date === day : true) && x.conf !== "Baja")) {
    const now = madridNow(); if (a.f.date === now.date && a.f.time && a.f.time <= now.time) continue;
    const legs = a.sels.filter((s) => UI[MK_GROUP[s.grp]] && (s.o || UI.noOdds) && !["O05", "LO05", "VO05", "U45", "12"].includes(s.c))
      .map((s) => ({a, s, o: s.o || s.minO, real: !!s.o})).filter((l) => l.o >= 1.05 && l.o < T * 1.02 && l.s.p >= 0.3);
    legs.sort((x, y) => y.s.p - x.s.p); pool.push(...legs.slice(0, 3));
  }
  pool.sort((x, y) => y.s.p - x.s.p);
  const P = pool.slice(0, 60), LT = Math.log(T);
  let beam = [{legs: [], lo: 0, lp: 0, used: new Set()}]; const done = [];
  for (let depth = 0; depth < maxL; depth++) {
    const next = [];
    for (const st of beam) for (const l of P) {
      if (st.used.has(l.a.f.id)) continue;
      if (st.legs.length && l.s.p > st.legs[st.legs.length - 1].s.p) continue;  // orden para no repetir combinaciones
      const lo = st.lo + Math.log(l.o), lp = st.lp + Math.log(l.s.p), legs = [...st.legs, l];
      if (lo >= LT) { if (lo <= LT + Math.log(1.35)) done.push({legs, O: Math.exp(lo), P: Math.exp(lp)}); }
      else next.push({legs, lo, lp, used: new Set([...st.used, l.a.f.id])});
    }
    next.sort((x, y) => (y.lp - y.lo * 0.0) - (x.lp - x.lo * 0.0) || y.lo - x.lo);
    beam = next.sort((x, y) => (y.lp + 0.6 * y.lo) - (x.lp + 0.6 * x.lo)).slice(0, 400);
  }
  done.sort((x, y) => y.P - x.P);
  const out = [], sigs = new Set();
  for (const c of done) { const k = c.legs.map((l) => l.a.f.id + l.s.c).sort().join(); if (!sigs.has(k)) { sigs.add(k); out.push(c); } if (out.length >= 3) break; }
  return out.map((c) => ({...c, EV: c.legs.every((l) => l.real) ? c.P * c.O - 1 : null, allReal: c.legs.every((l) => l.real)}));
}

      <div class="muted">Cuota justa de la combinada: ${num(1 / c.P)}. ${c.EV != null && c.EV < 0 ? "Paga menos de lo que vale, como casi todas las combinadas: solo merece la pena si tu casa paga más o da bonificación." : ""}</div>

   <div class="btns"><button class="primary" data-analyze>Analizar</button></div></div>`;
  if (UI.anRes) h += UI.anRes === "x" ? `<div class="card empty">Elige un partido con datos suficientes.</div>` : betAnalysisCard(UI.anRes);

        <div class="muted">${f.fav.length} datos a favor · ${f.con.length} en contra${r && r.ev != null ? ` · EV ${spct(r.ev)}` : ""}</div></div>`; }).join("") +
    `<div class="row" style="margin-top:6px"><span>Acertar todas: <b>${pct(cs.P, 1)}</b></span><span>${cs.O ? `Cuota ${num(cs.O)} · <span class="${cls(cs.ev)}">EV ${spct(cs.ev)}</span>` : `Justa ${num(cs.fair)}`}</span></div>

function comboStats(legs) {
  const P = legs.reduce((s, l) => s * l.p, 1);
  const O = legs.every((l) => l.o) ? legs.reduce((s, l) => s * l.o, 1) : null;
  return {P, O, fair: 1 / P, ev: O ? P * O - 1 : null, minO: legs.reduce((s, l) => s * Math.max(l.minO, 1 / l.p), 1)};
}
function vCombi() {
  const ok = A.filter((a) => a.ok);
  const legs = []; for (const a of ok) { const s = a.sels.filter((x) => x.verdict === "valor").sort((x, y) => y.ev - x.ev)[0]; if (s) legs.push({a, s}); }
  const combos = [];
  for (let i = 0; i < legs.length; i++) for (let j = i + 1; j < legs.length; j++) {
    combos.push([legs[i], legs[j]]);
    for (let k = j + 1; k < legs.length && legs.length <= 14; k++) combos.push([legs[i], legs[j], legs[k]]);
  }
  const scored = combos.map((c) => ({c, st: comboStats(c.map(({a, s}) => ({p: s.p, o: s.o, minO: s.minO})))})).sort((x, y) => y.st.ev - x.st.ev).slice(0, 4);
  const safe = []; for (const a of ok) { const s = a.sels.filter((x) => x.p >= 0.7 && x.p < 0.92 && ["1X", "X2", "O15", "U35", "U45", "LO05", "VO05"].includes(x.c)).sort((x, y) => y.p - x.p)[0]; if (s) safe.push({a, s}); }
  safe.sort((x, y) => y.s.p - x.s.p);
  let h = sampleBanner() + `<p class="lead">En una combinada se multiplican las cuotas, pero también los márgenes de la casa: solo tiene sentido si cada selección tiene valor por sí misma. Se usan siempre partidos distintos.</p>`;
  h += `<h2>Combinadas con selecciones de valor</h2>` + (scored.length ? scored.map(({c, st}) => `<div class="card"><div class="row"><b>${c.length} selecciones · cuota ${num(st.O)}</b><span class="${cls(st.ev)}">EV ${spct(st.ev)}</span></div>
     ${c.map(({a, s}) => `<div class="muted">${esc(a.f.home)} – ${esc(a.f.away)}: ${esc(s.label)} a ${num(s.o)} (${pct(s.p)})</div>`).join("")}
     <div class="muted">Probabilidad de acertar todas: <b>${pct(st.P, 1)}</b>. Fallará la mayoría de las veces aunque tenga valor.</div></div>`).join("")
    : `<div class="card empty">Hacen falta al menos dos partidos con valor para proponer una combinada.</div>`);
  const sp = safe.slice(0, 3);
  if (sp.length >= 2) {
    const st = comboStats(sp.map(({s}) => ({p: s.p, o: s.o, minO: s.minO})));
    h += `<h2>Combinada «prudente» (alta probabilidad)</h2><div class="card">${sp.map(({a, s}) => `<div class="muted">${esc(a.f.home)} – ${esc(a.f.away)}: ${esc(s.label)} (${pct(s.p)}, justa ${num(s.fair)})</div>`).join("")}
     <div class="row" style="margin-top:6px"><span>Probabilidad de acertar: <b>${pct(st.P)}</b></span><span>Cuota justa ${num(st.fair)}</span></div>
     <div class="muted">Solo tendría valor si tu casa paga la combinada a <b>${num(st.minO)}</b> o más. Normalmente no lo hace: compruébalo antes.</div></div>`;
  }
  const cs = S.combo.length ? comboStats(S.combo) : null;
  h += `<h2>Tu combinada</h2><div class="card">${S.combo.length ? S.combo.map((l, i) => `<div class="mk row"><span>${esc(l.home)} – ${esc(l.away)}: ${esc(l.label)} · ${l.o ? num(l.o) : "sin cuota"} (${pct(l.p)})</span><button data-rmcombo="${i}" aria-label="Quitar">✕</button></div>`).join("") +
    `<div class="row" style="margin-top:6px"><span>Acertar todas: <b>${pct(cs.P, 1)}</b></span><span>${cs.O ? `Cuota ${num(cs.O)} · <span class="${cls(cs.ev)}">EV ${spct(cs.ev)}</span>` : `Justa ${num(cs.fair)}`}</span></div>
     ${cs.O ? "" : `<div class="muted">Escribe la cuota de cada selección en su ficha para calcular el valor.</div>`}<div class="btns"><button data-clearcombo>Vaciar</button></div>`
    : `<div class="empty">Añade selecciones con «+ Combinada» desde la ficha de cada partido.</div>`}</div>`;
  return h;
}

function simCurve(curve) {
  if (curve.length < 2) return `<div class="empty">La curva aparecerá cuando se resuelvan las primeras apuestas.</div>`;
  const w = 340, h = 130, p = 24, ys = curve.map((c) => c.bank), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const X = (i) => p + i * (w - 2 * p) / (curve.length - 1), Y = (v) => h - p - (v - lo) * (h - 2 * p) / span;
  const base = Y(curve[0].bank);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Evolución del saldo simulado">
   <line x1="${p}" x2="${w - p}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-dasharray="3 3"/>
   <path d="${curve.map((c, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(c.bank).toFixed(1)).join(" ")}" fill="none" stroke="var(--brand)" stroke-width="2.2"/>
   <text x="${p}" y="12" font-size="10" fill="var(--ink-2)">${num(hi)} €</text><text x="${p}" y="${h - 6}" font-size="10" fill="var(--ink-2)">${num(lo)} €</text></svg>`;
}

  }
  const g = Object.entries(st.groups);
  if (g.length) h += `<h2>Por mercado</h2><div class="card scroll"><table><tr><th>Mercado</th><th>Apuestas</th><th>Apostado</th><th>Resultado</th><th>Yield</th></tr>${g.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${num(v.staked)} €</td><td class="${cls(v.pnl)}">${num(v.pnl)} €</td><td>${spct(v.pnl / v.staked)}</td></tr>`).join("")}</table></div>`;
  const bets = sim.bets.slice().sort((x, y) => (x.status === "pendiente" ? 0 : 1) - (y.status === "pendiente" ? 0 : 1) || (y.date + y.time).localeCompare(x.date + x.time));
  h += `<h2>Apuestas simuladas</h2><div class="card">${bets.length ? bets.map(simBetLine).join("") : `<div class="empty">Todavía ninguna: el simulador apuesta en cuanto haya partidos con valor y cuotas reales.</div>`}</div>`;
  if (!S.serverSim) h += `<div class="btns"><button data-resetsim>Reiniciar simulador</button></div>`;
  return h + `<h2>Selecciones que sigues a mano</h2>`;
}
function vSeguir() {
  const t = S.track; const st = t.filter((x) => x.status !== "pendiente");
  const pnl = st.reduce((s, x) => s + x.pnl, 0), expP = st.reduce((s, x) => s + x.p, 0), hits = st.filter((x) => x.status === "ganada").length;
  const eur = st.reduce((s, x) => s + (x.stake || 0) * x.pnl, 0);
  let h = vSim() + `<p class="lead">Registro de las selecciones que marcas con «Seguir», a 1 € por apuesta y sin dinero real. Se resuelven solas cuando subes un CSV con los resultados.</p>
   <div class="card"><div class="kpis"><div class="kpi"><b>${t.length}</b><span>Seguidas</span></div><div class="kpi"><b>${st.length}</b><span>Resueltas</span></div>
   <div class="kpi"><b class="${cls(pnl)}">${num(pnl)} u</b><span>Resultado</span></div><div class="kpi"><b>${st.length ? spct(pnl / st.length) : "—"}</b><span>Yield</span></div>
   <div class="kpi"><b>${hits} / ${num(expP, 1)}</b><span>Aciertos reales / esperados</span></div>
   <div class="kpi"><b class="${cls(eur)}">${num(eur)} €</b><span>Con el stake sugerido (simulado)</span></div></div>
   ${st.length && st.length < 100 ? `<p class="muted">Con ${st.length} apuestas el resultado es casi todo ruido: harían falta cientos para saber si hay ventaja.</p>` : ""}</div>`;
  return h + (t.length ? `<div class="card">${t.map((x) => `<div class="mk"><div class="row"><span class="teams">${esc(x.home)} – ${esc(x.away)}</span><span class="${x.status === "ganada" ? "pos" : x.status === "perdida" ? "neg" : "pen"}">${x.status}${x.result ? " · " + x.result : ""}</span></div>
    <div class="muted">${esc(x.label)} a ${num(x.o)} · estimada ${pct(x.p)} · EV ${spct(x.ev)} · stake sugerido ${num(x.stake || 0)} € · ${fdate(x.date)} · marcada como «${esc(x.verdict)}»</div></div>`).join("")}<div class="btns"><button data-cleartrack>Borrar registro</button></div></div>` : `<div class="card empty">Aún no sigues ninguna selección.</div>`);
}

function vDatos() {
  const divs = Object.entries(S.hist);
  const s = S.settings;
  return `<h2>Tus datos</h2><div class="card">${divs.length ? `<div class="scroll"><table><tr><th>Liga</th><th>Partidos</th><th>Desde</th><th>Hasta</th><th>Tiros</th></tr>
   ${divs.map(([d, r]) => `<tr><td>${esc(LEAGUES[d] || d)}</td><td>${r.length}</td><td>${fdate(r[0][0], {day: "numeric", month: "short", year: "2-digit"})}</td><td>${fdate(r[r.length - 1][0], {day: "numeric", month: "short", year: "2-digit"})}</td><td>${r.some((x) => x[7] != null) ? "sí" : "no"}</td></tr>`).join("")}</table></div>
   <p class="muted">${S.fixtures.length} partidos próximos cargados.</p>` : `<div class="empty">Todavía no hay datos reales.</div>`}
   <div class="btns"><button class="primary" id="up">Subir CSV o JSON</button><button id="clear">Borrar todo</button></div><p class="muted" id="msg"></p></div>
   ${S.feed ? `<h2>Actualización automática</h2><div class="card"><div>Última: <b>${new Date(S.feed.generado).toLocaleString("es-ES")}</b> · ${S.feed.n} partidos con cuotas · créditos de la API restantes: ${esc(S.feed.creditos ?? "—")}</div>
   ${S.feed.avisos.map((x) => `<p class="neg">${esc(x)}</p>`).join("")}
   ${S.feed.sin.length ? `<p class="muted">Partidos que no se pudieron emparejar (añade el nombre a scripts/alias.json): ${S.feed.sin.map(esc).join(" · ")}</p>` : ""}</div>` : ""}
   <h2>Estudio por liga (histórico)</h2><div class="card"><p class="muted">Cada sistema probado en cada liga con 9.092 partidos de 2025-26 y 2026-27, apostando a Bet365. Se muestran las 15 combinaciones con mejor rentabilidad; entre corchetes, el margen de error al 95 %. Solo cuenta como hallazgo sólido si el margen no cruza el cero.</p>
   <div class="scroll"><table><tr><th>Liga</th><th>Sistema</th><th>Apuestas</th><th>ROI</th><th>Margen</th></tr>
   ${ESTUDIO_LIGAS.slice().sort((x, y) => y.roi - x.roi).slice(0, 15).map((x) => `<tr><td>${esc(LEAGUES[x.liga] || x.liga)}</td><td>${esc(x.sistema)}</td><td>${x.n}</td><td class="${cls(x.roi)}">${spct(x.roi)}</td><td>${x.lo > 0 ? "<b>" : ""}[${spct(x.lo, 0)}, ${spct(x.hi, 0)}]${x.lo > 0 ? "</b>" : ""}</td></tr>`).join("")}</table></div>
   <p class="muted">Conclusión: de ${ESTUDIO_LIGAS.length} pruebas solo 1 es significativa (favoritos en Portugal) y por azar cabría esperar unas 3. Todavía no hay ningún sistema por liga demostrado; el laboratorio del simulador lo seguirá comprobando con partidos nuevos.</p></div>
   <h2>Datos incluidos</h2><div class="card muted">${esc(BUILTIN.meta.fuentes)} Equipos recién ascendidos sin historial en estas ligas: ${Object.values(BUILTIN.nuevos).flat().join(", ")}; su estimación es menos fiable hasta que acumulen partidos. Las cuotas no se incluyen: no hay ninguna fuente gratuita que pueda leer automáticamente.</div>
   <h2>Completar o actualizar con tus archivos</h2><div class="card"><ol>
   <li>Entra en <b>football-data.co.uk</b>, abre la liga que quieras y descarga el CSV de la <b>temporada actual</b>: completa las jornadas que falten y añade tiros a puerta y cuotas de cierre. También sirve para ligas que no vienen incluidas (Segunda, Championship, Portugal…).</li>
   <li>En la misma web, el enlace de <b>próximos partidos</b> («Fixtures») trae el calendario de la jornada con cuotas de varias casas. Descárgalo antes de cada jornada.</li>
   <li>Pulsa «Subir» y elige los archivos. Puedes subirlos desde el móvil.</li>
   <li>Después de cada jornada, vuelve a subir el CSV de la temporada: se añaden los resultados y se resuelven las selecciones que sigues.</li></ol>
   <p class="muted">Alternativa para las cuotas: con una clave gratuita de the-odds-api.com, abre en el navegador una dirección como<br><code>https://api.the-odds-api.com/v4/sports/soccer_spain_la_liga/odds?regions=eu&amp;markets=h2h,totals&amp;apiKey=TU_CLAVE</code><br>guarda la respuesta como .json y súbela aquí.</p>
   <p class="muted">Las cuotas de más/menos 1,5, 3,5, ambos marcan, etc. no vienen en estos archivos: escríbelas en la ficha del partido con lo que veas en tu casa.</p></div>
   <h2>Ajustes del modelo</h2><div class="card">
   <div class="setting"><label for="s_w">Peso del modelo frente al mercado<small>0 = solo mercado, 1 = solo modelo. Con un modelo sin validar, mejor bajo.</small></label><input id="s_w" type="number" min="0" max="1" step="0.05" value="${s.w}"></div>
   <div class="setting"><label for="s_sh">Peso de los tiros a puerta<small>Los tiros predicen los goles futuros mejor que los goles pasados.</small></label><input id="s_sh" type="number" min="0" max="1" step="0.1" value="${s.shots}"></div>
   <div class="setting"><label for="s_thr">Ventaja mínima exigida (EV)<small>Margen de seguridad: por debajo, «sin valor».</small></label><input id="s_thr" type="number" min="0" max="0.2" step="0.01" value="${s.thr}"></div>
   <div class="setting"><label for="s_pm">Umbral de «muy probable»</label><input id="s_pm" type="number" min="0.5" max="0.95" step="0.01" value="${s.probMin}"></div>
   <div class="setting"><label for="s_bk">Cuotas con las que comparar<small>Bet365 opera en España; «mejor» suma casas a las que quizá no tengas acceso.</small></label>
   <select id="s_bk">${[["B365", "Bet365"], ["Avg", "Media del mercado"], ["Max", "Mejor cuota"], ["PS", "Pinnacle"]].map(([k, l]) => `<option value="${k}" ${s.book === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
   <div class="setting"><label for="s_ven">Peso de jugar en casa / fuera<small>Cuántos partidos «vale» el nivel general antes de fiarse del rendimiento en ese campo. Menos = más peso a casa/fuera. 1000 = desactivado.</small></label><input id="s_ven" type="number" min="1" max="1000" step="1" value="${s.venueK}"></div>
   <div class="setting"><label for="s_tab">Peso de la clasificación<small>Puntos por partido del local en casa frente a los del visitante fuera. 0 = no se usa.</small></label><input id="s_tab" type="number" min="0" max="1" step="0.05" value="${s.tableW}"></div>
   <div class="setting"><label for="s_bank">Bankroll para calcular stakes (€)<small>Lo que estás dispuesto a perder entero. No es un objetivo de gasto.</small></label><input id="s_bank" type="number" min="10" step="10" value="${s.bank}"></div>
   <div class="setting"><label for="s_kel">Fracción de Kelly<small>0,25 = un cuarto del stake «óptimo». Más bajo = más prudente.</small></label><input id="s_kel" type="number" min="0.05" max="0.5" step="0.05" value="${s.kelly}"></div>
   <div class="setting"><label for="s_max">Máximo por apuesta (% del bankroll)</label><input id="s_max" type="number" min="0.005" max="0.1" step="0.005" value="${s.maxPct}"></div>
   <div class="btns"><button class="primary" id="saveset">Guardar ajustes</button><button id="resetset">Valores por defecto</button></div></div>
   <h2>Cómo funciona</h2><div class="card muted">Cada equipo tiene una fuerza de ataque y otra de defensa calculadas con sus goles y sus tiros a puerta, dando más peso a los partidos recientes y acercando a la media a los equipos con pocos datos. Con eso se calcula la probabilidad de cada marcador (modelo de Poisson), y de ahí salen todas las líneas de forma coherente. Esa estimación se mezcla con lo que dice el mercado sin margen, que suele ser el mejor pronóstico disponible. Una selección tiene «valor» solo si la cuota supera lo que vale con margen de seguridad, y las cuotas altas exigen más margen. El importe sugerido sigue el criterio de Kelly fraccionado: se apuesta más cuanto mayor es la ventaja respecto a la cuota, no cuanto más «segura» parece la apuesta. Un 90 % a cuota 1,05 vale 0 €, porque pierde dinero a la larga. El modelo no conoce lesiones, alineaciones ni motivación: si discrepa mucho del mercado, se marca como «dudosa». Apostar implica riesgo de perder dinero; ayuda en jugarbien.es.</div>`;
}

function render() {
  head();
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  const html = detail ? vDetail(detail) : {visual: vVisual, radar: vRadar, partidos: vPartidos, combi: vMontador, seguir: vSeguir, datos: vDatos}[view]();
  $("#view").innerHTML = html;
}

/* ------------------------------------------------ eventos */
if (HAS_DOM) document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-open],[data-back],[data-follow],[data-combo],[data-rmcombo],[data-clearcombo],[data-cleartrack],[data-resetsim],[data-build],[data-analyze],[data-usecombo],#up,#clear,#saveset,#resetset,nav button");
  if (!t) return;
  if (t.matches("nav button")) { view = t.dataset.v; detail = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.open) { detail = t.dataset.open; render(); window.scrollTo(0, 0); return; }
  if (t.hasAttribute("data-back")) { detail = null; render(); return; }
  if (t.dataset.follow) { const [i, ...r] = t.dataset.follow.split("|"); const c = r.pop(); await follow([i, ...r].join("|"), c); return; }
  if (t.dataset.combo) { const p = t.dataset.combo.split("|"); const c = p.pop(); await addCombo(p.join("|"), c); return; }
  if (t.hasAttribute("data-build")) { UI.res = buildCombos(); render(); return; }
  if (t.hasAttribute("data-analyze")) {
    const o = parseFloat(String(UI.an.o).replace(",", "."));
    UI.anRes = UI.an.fid ? (analyseBet(UI.an.fid, UI.an.c, isFinite(o) && o > 1 ? o : null) || "x") : "x"; render(); return;
  }
  if (t.dataset.usecombo != null) {
    const c = UI.res[+t.dataset.usecombo]; S.combo = [];
    for (const l of c.legs) S.combo.push({fid: l.a.f.id, c: l.s.c, label: l.s.label, home: l.a.f.home, away: l.a.f.away, p: l.s.p, o: l.real ? l.o : null, minO: l.s.minO});
    await Store.set("combo", S.combo); render(); return;
  }
  if (t.dataset.rmcombo) { S.combo.splice(+t.dataset.rmcombo, 1); await Store.set("combo", S.combo); render(); return; }
  if (t.hasAttribute("data-clearcombo")) { S.combo = []; await Store.set("combo", S.combo); render(); return; }
  if (t.hasAttribute("data-resetsim")) { if (confirm("¿Reiniciar el simulador? Se borran sus apuestas.")) { S.sim = newSim(); await Store.set("sim", S.sim); recompute(); render(); } return; }
  if (t.hasAttribute("data-cleartrack")) { if (confirm("¿Borrar el registro de seguimiento?")) { S.track = []; await Store.set("track", S.track); render(); } return; }
  if (t.id === "up") { $("#file").click(); return; }
  if (t.id === "clear") {
    if (!confirm("¿Borrar los datos que has subido? Se conservan los datos públicos integrados.")) return;
    for (const d of Object.keys(S.hist)) await Store.set("hist_" + d, null);
    S.fixtures = []; await saveAll(["fixtures"]); await loadAll(); recompute(); render(); return;
  }
  if (t.id === "saveset" || t.id === "resetset") {
    S.settings = t.id === "resetset" ? {...DEFAULTS} : {...S.settings, w: +$("#s_w").value, shots: +$("#s_sh").value, thr: +$("#s_thr").value, probMin: +$("#s_pm").value, book: $("#s_bk").value, bank: +$("#s_bank").value, venueK: +$("#s_ven").value, tableW: +$("#s_tab").value, kelly: +$("#s_kel").value, maxPct: +$("#s_max").value};
    await Store.set("settings", S.settings); recompute(); render(); return;
  }
});
if (HAS_DOM) document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.ui) { UI[el.dataset.ui] = el.type === "checkbox" ? el.checked : el.value; return; }
  if (el.dataset && el.dataset.an) { UI.an[el.dataset.an] = el.value; return; }
  if (el.dataset && el.dataset.typed) {
    const v = parseFloat(String(el.value).replace(",", "."));
    if (isFinite(v) && v > 1) S.typed[el.dataset.typed] = v; else delete S.typed[el.dataset.typed];
    await Store.set("typed", S.typed); recompute(); render();
  }
});
if (HAS_DOM) $("#file").addEventListener("change", async (e) => {
  const files = [...e.target.files]; if (!files.length) return;
  let nh = 0, nf = 0, bad = [];
  for (const f of files) {
    try {
      const txt = await f.text();
      const r = f.name.toLowerCase().endsWith(".json") || txt.trim().startsWith("[") || txt.trim().startsWith("{") ? ingestOddsAPI(JSON.parse(txt)) : ingestCSV(txt);
      nh += r.nh; nf += r.nf; if (!r.nh && !r.nf) bad.push(f.name);
    } catch (err) { bad.push(f.name); }
  }
  await saveAll(["hist", "fixtures", "track", "combo", "typed"]);
  recompute(); view = "datos"; detail = null; render();
  $("#msg").textContent = `Añadidos ${nh} resultados y ${nf} próximos partidos.` + (bad.length ? ` No se pudieron leer: ${bad.join(", ")}.` : "");
  e.target.value = "";
});

/* ------------------------------------------------ datos de ejemplo (inventados) */
function makeSample() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pois = (l) => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= rnd(); } while (p > L); return k - 1; };
  const names = ["Atlético Norte", "Real Costa", "Deportivo Sierra", "Unión Valle", "Racing Puerto", "CD Llanura", "Sporting Bahía", "UD Montaña", "Celta Ribera", "Club Meseta", "CF Faro", "Real Pinar"];
  const att = names.map(() => 0.75 + rnd() * 0.6), def = names.map(() => 0.75 + rnd() * 0.6);
  att[2] = 1.35; // tira mucho pero en la muestra marcará poco
  const rows = []; const start = new Date(); start.setDate(start.getDate() - 7 * 11);
  for (let md = 0; md < 11; md++) {
    const d = new Date(start); d.setDate(d.getDate() + 7 * md); const ds = d.toISOString().slice(0, 10);
    const ord = names.map((_, i) => i).sort(() => rnd() - 0.5);
    for (let k = 0; k < 6; k++) {
      const h = ord[2 * k], a = ord[2 * k + 1];
      const l = 1.45 * att[h] * def[a], m = 1.15 * att[a] * def[h];
      let hg = pois(l), ag = pois(m);
      const hst = Math.max(hg, Math.round(l * 3.1 + rnd() * 3 - 1)), ast = Math.max(ag, Math.round(m * 3.1 + rnd() * 3 - 1));
      if ((h === 2 || a === 2) && md >= 5) { if (h === 2) hg = Math.min(hg, rnd() < 0.7 ? 0 : 1); else ag = Math.min(ag, rnd() < 0.7 ? 0 : 1); }
      rows.push([ds, names[h], names[a], hg, ag, hst + 6, ast + 5, hst, ast]);
    }
  }
  S.hist = {EJ: rows};
  const nd = new Date(); nd.setDate(nd.getDate() + 2); const nds = nd.toISOString().slice(0, 10);
  const ord = names.map((_, i) => i).sort(() => rnd() - 0.5);
  S.fixtures = [];
  for (let k = 0; k < 6; k++) {
    const h = ord[2 * k], a = ord[2 * k + 1]; const l = 1.45 * att[h] * def[a], m = 1.15 * att[a] * def[h];
    const P = probs(poisMatrix(l, m)); const n = () => Math.exp((rnd() - 0.5) * 0.12);
    const price = (p, mg) => Math.round(100 / (p * mg * n())) / 100;
    S.fixtures.push({id: `EJ|${nds}|${names[h]}|${names[a]}`, div: "EJ", date: nds, time: "18:30", home: names[h], away: names[a], src: "ejemplo",
      odds: {B365: {H: price(P.H, 1.05), D: price(P.D, 1.05), A: price(P.A, 1.05), O25: price(P.O25, 1.06), U25: price(P.U25, 1.06)},
             PS: {H: price(P.H, 1.025), D: price(P.D, 1.025), A: price(P.A, 1.025), O25: price(P.O25, 1.03), U25: price(P.U25, 1.03)}}});
  }
  S.sample = true;
}
